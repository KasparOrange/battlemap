name: battlemap
description: A D&D digital battlemap for TV tables
publish_to: 'none'
version: 1.1.4+14

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.22.0
  pdfrx: ^2.6.1
  file_picker: ^12.2.0
  file_picker_web: ^3.1.0  # only for FilePickerWebOptions (web_file_picker_options.dart)
  web_socket_channel: ^3.0.0
  path_provider: ^2.1.0
  package_info_plus: ^10.0.0
  uuid: ^4.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  # <1.8: 1.8 declares tvOS itself but its pod depends on the iOS-only Flutter
  # pod, which breaks `pod install` for tvOS; the _tvos port below covers it.
  wakelock_plus: '>=1.3.3 <1.8.0'
  flutter_phoenix: ^1.1.1
  web: ^1.0.0
  # tvOS (flutter-tvos dev target, docs/apple-tv-dev.md): federated ports of the
  # native plugins the TV side uses; no-ops on every other platform.
  flutter_tvos: ^1.1.3
  path_provider_tvos: ^0.0.3
  package_info_plus_tvos: ^0.0.1
  wakelock_plus_tvos: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter

flutter:
  assets:
    - shorebird.yaml
  uses-material-design: true
