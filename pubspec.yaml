name: battlemap
description: A D&D digital battlemap for TV tables
publish_to: 'none'
version: 1.1.1+11

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.22.0
  pdfrx: ^1.0.0
  file_picker: ^8.0.0
  web_socket_channel: ^3.0.0
  path_provider: ^2.1.0
  package_info_plus: ^8.0.0
  uuid: ^4.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  wakelock_plus: ^1.3.3
  flutter_phoenix: ^1.1.1
  web: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter

flutter:
  assets:
    - shorebird.yaml
  uses-material-design: true
