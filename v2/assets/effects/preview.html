<!doctype html>
<!--
  Effects preview — plays every effect of the library from its manifest (index.json → <id>/effect.json)
  on a dark, map-like floor with a square grid. Standalone: vanilla JS + canvas (+ one WebGL2 canvas
  for the shaders), no build. Serve the folder (`python3 -m http.server` in v2/assets/effects) and open
  preview.html. Query: ?only=id,id  ?cat=global|regional|point|aura|map-loop  ?cell=200  ?cols=8
  This is a look-and-loop check for people, not the runtime: particles run on the CPU here.
-->
<meta charset="utf-8">
<title>battlemap — effects preview</title>
<style>
  html, body { margin: 0; background: #101013; color: #ddd; font: 12px/1.3 system-ui, sans-serif; }
  #bar { position: sticky; top: 0; z-index: 2; display: flex; gap: 6px; flex-wrap: wrap; padding: 8px; background: #18181cee; }
  #bar button { background: #2a2a30; color: #ddd; border: 1px solid #444; border-radius: 6px; padding: 3px 9px; cursor: pointer; }
  #bar button.on { background: #3d5afe; border-color: #3d5afe; color: #fff; }
  #bar span { margin-left: auto; opacity: .7; }
  canvas#stage { display: block; }
</style>
<div id="bar"></div>
<canvas id="stage"></canvas>
<script>
"use strict";
const Q = new URLSearchParams(location.search);
const CELL = Number(Q.get("cell") || 200);           // px per preview cell
const LABEL = 30;                                     // px of label under a cell
const stage = document.getElementById("stage");
const g = stage.getContext("2d");
const gl = document.createElement("canvas").getContext("webgl2", { premultipliedAlpha: true, alpha: true });
let effects = [];                                     // loaded manifests (+ runtime state)
let category = Q.get("cat") || "all";
const byId = {};
const compiledExtra = {};                             // shaders named by texture motion recipes

// ---------------------------------------------------------------- loading
const loadImage = (src) => new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => bad(new Error(src)); i.src = src; });
const loadText = (src) => fetch(src).then((r) => { if (!r.ok) throw new Error(src); return r.text(); });

async function load() {
  const index = await (await fetch("index.json")).json();
  const only = Q.get("only") ? new Set(Q.get("only").split(",")) : null;
  const rows = index.effects.filter((r) => !only || only.has(r.id));
  // every manifest (composites need their parts even when filtered out)
  const all = await Promise.all(index.effects.map(async (r) => {
    const m = await (await fetch(r.manifest)).json();
    m.dir = r.id + "/";
    byId[m.id] = m;
    return m;
  }));
  await Promise.all(all.map(prepare));
  effects = all.filter((m) => rows.some((r) => r.id === m.id));
  buildBar();
  layout();
  // for tools/shoot_preview.mjs --thumbs: where each shown effect's cell is
  window.cells = () => shown().map((m, i) => ({ id: m.id, x: (i % cols) * CELL, y: Math.floor(i / cols) * (CELL + LABEL), size: CELL }));
  window.ready = true;
}

async function prepare(m) {
  if (m.sheet) m.atlasImages = await Promise.all(m.sheet.atlases.map((a) => loadImage(m.dir + a.file)));
  if (m.texture) m.textureImage = await loadImage(m.dir + m.texture.file);
  if (m.particles) m.particleImages = await Promise.all(m.particles.textures.map((t) => loadImage(m.dir + t.file)));
  if (m.shader) m.program = await compileShader(m);
  if (m.motion && m.motion.shader && !compiledExtra[m.motion.shader]) {   // compile-check the texture's shader
    compiledExtra[m.motion.shader] = await compileShader({ id: m.id, dir: "shaders/", shader: { vertex: "filter.vert", fragment: m.motion.shader } });
  }
  const colour = m.motion && m.motion.color;
  if (colour && m.textureImage) m.textureImage = tinted(m.textureImage, colour);
  m.seed = Math.random() * 100;
}

// A white texture coloured like the runtime's tint (multiply).
function tinted(img, colour) {
  const c = document.createElement("canvas"); c.width = img.width; c.height = img.height;
  const x = c.getContext("2d");
  x.drawImage(img, 0, 0); x.globalCompositeOperation = "multiply"; x.fillStyle = colour; x.fillRect(0, 0, c.width, c.height);
  x.globalCompositeOperation = "destination-in"; x.drawImage(img, 0, 0);
  return c;
}

// ---------------------------------------------------------------- layout and background
let cols = 1, floor = null;
function layout() {
  const list = shown();
  cols = Number(Q.get("cols")) || Math.max(1, Math.floor(innerWidth / CELL));
  stage.width = cols * CELL;
  stage.height = Math.ceil(list.length / cols) * (CELL + LABEL);
  floor = makeFloor(CELL, CELL);
}
const shown = () => effects.filter((m) => category === "all" || m.category === category);

// A dark stone floor with a faint square grid, drawn once and reused under every cell.
function makeFloor(w, h) {
  const c = document.createElement("canvas"); c.width = w; c.height = h;
  const x = c.getContext("2d");
  x.fillStyle = "#2b2824"; x.fillRect(0, 0, w, h);
  let s = 7;
  const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 260; i++) {
    x.fillStyle = `rgba(${90 + rnd() * 50},${80 + rnd() * 40},${60 + rnd() * 30},${0.05 + rnd() * 0.08})`;
    x.beginPath(); x.arc(rnd() * w, rnd() * h, 2 + rnd() * 18, 0, 7); x.fill();
  }
  x.strokeStyle = "rgba(0,0,0,.35)"; x.lineWidth = 1;
  const step = w / 6;
  for (let i = 0; i <= 6; i++) { x.beginPath(); x.moveTo(i * step + .5, 0); x.lineTo(i * step + .5, h); x.stroke(); x.beginPath(); x.moveTo(0, i * step + .5); x.lineTo(w, i * step + .5); x.stroke(); }
  return c;
}

// How many squares a cell shows for an effect: its size plus a margin, at least 2.
function spanOf(m) {
  if (m.category === "global") return 6;
  if (m.technique === "composite") return Math.max(2, ...m.parts.map((p) => { const pm = byId[p.id]; return pm && pm.size ? Math.max(pm.size.w, pm.size.h) * (p.scale || 1) * 0.8 : 1; }));
  const w = m.size ? Math.max(m.size.w, m.size.h) : (m.squares || 2);
  if (m.particles) return Math.max(2.5, (m.squares || 2) * 1.6);
  return Math.max(2, w * 1.15);
}

// ---------------------------------------------------------------- drawing
const BLEND = { add: "lighter", screen: "screen", multiply: "multiply", normal: "source-over" };

function drawSheet(m, t, cx, cy, sqPx, scale = 1, phase = 0) {
  const s = m.sheet, n = s.frames.length;
  const life = s.loop ? Infinity : n / s.fps;
  let k = (t + phase) * (s.fps || 12);
  if (s.variants) k = 0;
  if (!s.loop && !s.variants) { const cycle = life + 0.8; const tt = (t + phase) % cycle; if (tt > life) return; k = tt * s.fps; }
  const w = m.size.w * sqPx * scale, h = m.size.h * sqPx * scale;
  const x = cx - m.anchor[0] * w, y = cy - m.anchor[1] * h;
  const draw = (i, a) => { const [ai, fx, fy] = s.frames[i]; g.globalAlpha = a; g.drawImage(m.atlasImages[ai], fx, fy, s.frameW, s.frameH, x, y, w, h); };
  g.globalCompositeOperation = BLEND[m.blend] || "source-over";
  if (s.variants) {                                   // a set: show four variants side by side
    const v = Math.min(4, n), cw = w * 0.5;
    for (let i = 0; i < v; i++) { const [ai, fx, fy] = s.frames[i]; g.globalAlpha = 1; g.drawImage(m.atlasImages[ai], fx, fy, s.frameW, s.frameH, cx - cw + (i % 2) * cw - cw * 0.0, cy - cw + Math.floor(i / 2) * cw, cw, cw * s.frameH / s.frameW); }
  } else {
    const i0 = Math.floor(k) % n;
    if (s.crossfade && s.loop) { const f = k - Math.floor(k); draw(i0, 1); draw((i0 + 1) % n, f); }
    else draw(Math.min(i0, n - 1), 1);
  }
  g.globalAlpha = 1; g.globalCompositeOperation = "source-over";
}

// motion recipe of a texture effect (rotate, pulse, flicker, grow, fade, once)
function motionState(mo, t) {
  let rot = 0, alpha = 1, scale = 1;
  if (mo.rotate) rot = (mo.rotate * t) * Math.PI / 180;
  if (mo.pulse) { const p = Math.sin(2 * Math.PI * t / mo.pulse.period); alpha *= 1 - (mo.pulse.alpha || 0) * (0.5 - 0.5 * p); if (typeof mo.pulse.scale === "number") scale *= 1 + mo.pulse.scale * p; }
  if (mo.flicker) { const n = 0.5 + 0.25 * Math.sin(t * mo.flicker.hz * 2.1) + 0.25 * Math.sin(t * mo.flicker.hz * 3.7 + 1.3); alpha *= mo.flicker.alpha[0] + (mo.flicker.alpha[1] - mo.flicker.alpha[0]) * n; scale *= mo.flicker.scale[0] + (mo.flicker.scale[1] - mo.flicker.scale[0]) * n; }
  if (mo.glow) alpha *= 1 - mo.glow.amount * (0.5 + 0.5 * Math.sin(2 * Math.PI * t / mo.glow.period));
  let tt = t;
  if (mo.once) { tt = t % (mo.once + 0.8); if (tt > mo.once) return null; }
  if (mo.grow) { const f = Math.min(1, tt / mo.grow.duration); scale *= mo.grow.from + (1 - mo.grow.from) * (1 - Math.pow(1 - f, 3)); }
  if (mo.fadeIn) alpha *= Math.min(1, (mo.once ? tt : t % 8) / mo.fadeIn);
  if (mo.fadeOut && mo.once) alpha *= Math.min(1, Math.max(0, (mo.once - tt) / mo.fadeOut));
  if (mo.sway) rot += Math.sin(2 * Math.PI * t / mo.sway.period) * mo.sway.angle * Math.PI / 180;
  return { rot, alpha, scale };
}

function drawTexture(m, t, cx, cy, sqPx, scale = 1) {
  const st = motionState(m.motion || {}, t);
  if (!st) return;
  let w = m.size.w * sqPx * scale * st.scale, h = m.size.h * sqPx * scale * st.scale;
  if (m.category === "global") { w = CELL * 1.0; h = CELL * m.size.h / m.size.w * 1.0; w = Math.max(w, CELL); h = Math.max(h, CELL); }  // a global overlay covers the view
  g.save(); g.translate(cx, cy); g.rotate(st.rot);
  g.globalAlpha = st.alpha; g.globalCompositeOperation = BLEND[m.blend] || "source-over";
  g.drawImage(m.textureImage, -m.anchor[0] * w, -m.anchor[1] * h, w, h);
  g.restore();
}

function drawLayers(m, t, cx, cy, sqPx, scale = 1) {
  const s = m.sheet, w = m.size.w * sqPx * scale, h = m.size.h * sqPx * scale;
  g.globalCompositeOperation = BLEND[m.blend] || "source-over";
  for (const L of m.layers) {
    const [ai, fx, fy] = s.frames[L.frame];
    let sc = 1;
    if (L.pulse) { const p = 0.5 - 0.5 * Math.cos(2 * Math.PI * t / L.pulse.period); sc = L.pulse.scale[0] + (L.pulse.scale[1] - L.pulse.scale[0]) * p; }
    g.save(); g.translate(cx, cy); g.rotate(((L.rotate || 0) * t) * Math.PI / 180); g.scale(sc, sc);
    g.drawImage(m.atlasImages[ai], fx, fy, s.frameW, s.frameH, -m.anchor[0] * w, -m.anchor[1] * h, w, h);
    g.restore();
  }
  g.globalCompositeOperation = "source-over";
}

// CPU particles for the preview (the runtime does this on the GPU).
const rand = (r) => r[0] + Math.random() * (r[1] - r[0]);
function drawParticles(m, t, dt, cx, cy, sqPx, cell, scale = 1) {
  const p = m.particles;
  if (!m.ps && !p.burst) {           // warm up: start in the steady state, not empty
    m.ps = [];
    const saved = g.globalAlpha; g.globalAlpha = 0;
    for (let i = 0; i < 40; i++) { g.save(); g.globalAlpha = 0; drawParticles(m, t - 4 + i * 0.1, 0.1, -9999, -9999, sqPx, cell, scale); g.restore(); }
    g.globalAlpha = saved;
  }
  m.ps = m.ps || [];
  const spawn = () => {
    const a = rand(p.angle) * Math.PI / 180, sp = rand(p.speed);
    let x = 0, y = 0;
    if (p.emitter === "screen") { x = (Math.random() - 0.5) * cell / sqPx; y = (Math.random() - 0.5) * cell / sqPx; }
    else if (p.emitter === "area") { x = (Math.random() - 0.5) * p.w; y = (Math.random() - 0.5) * p.h; }
    else if (p.emitter === "ring") { const b = Math.random() * 6.283; x = Math.cos(b) * p.radius; y = Math.sin(b) * p.radius; }
    else { const b = Math.random() * 6.283, r = Math.random() * (p.radius || 0); x = Math.cos(b) * r; y = Math.sin(b) * r; }
    m.ps.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, age: 0, life: rand(p.life), size: rand(p.size), spin: p.spin ? rand(p.spin) : 0, rot: Math.random() * 6.28, tex: Math.floor(Math.random() * m.particleImages.length), ph: Math.random() * 6.28 });
  };
  if (p.burst) { m.cycle = (m.cycle || 0) + dt; if (!m.fired || m.cycle > p.life[1] + 1) { m.cycle = 0; m.fired = true; for (let i = 0; i < p.burst; i++) spawn(); } }
  else {
    // screen emitters count per 100 square² of what is visible
    const per = p.emitter === "screen" ? Math.pow(cell / sqPx, 2) / 100 : 1;
    m.acc = (m.acc || 0) + dt * p.rate * per;
    while (m.acc >= 1 && m.ps.length < p.max * per) { spawn(); m.acc -= 1; }
  }
  g.globalCompositeOperation = BLEND[m.blend] || "source-over";
  const cA = hex(p.colors[0]), cB = hex(p.colors[1]);
  for (const q of m.ps) {
    q.age += dt; q.vx += p.gravity[0] * dt; q.vy += p.gravity[1] * dt; q.x += q.vx * dt; q.y += q.vy * dt; q.rot += q.spin * Math.PI / 180 * dt;
    const f = q.age / q.life;
    const a = f < 0.5 ? p.alpha[0] + (p.alpha[1] - p.alpha[0]) * f * 2 : p.alpha[1] + (p.alpha[2] - p.alpha[1]) * (f - 0.5) * 2;
    const flick = p.flicker ? 0.7 + 0.3 * Math.sin(t * p.flicker * 6.28 + q.ph) : 1;
    const wob = p.wobble ? Math.sin(t * p.wobble[1] * 6.28 + q.ph) * p.wobble[0] : 0;
    const size = q.size * (1 + (p.grow - 1) * f) * sqPx * scale;
    const img = m.particleImages[q.tex];
    g.save(); g.translate(cx + (q.x + wob) * sqPx * scale, cy + q.y * sqPx * scale);
    g.rotate(p.alignToVelocity ? Math.atan2(q.vy, q.vx) : q.rot);
    g.globalAlpha = Math.max(0, Math.min(1, a * flick));
    const col = mix(cA, cB, f);
    g.drawImage(tintCache(m, q.tex, img, col), -size / 2, -size / 2 * img.height / img.width, size, size * img.height / img.width);
    g.restore();
  }
  m.ps = m.ps.filter((q) => q.age < q.life);
  g.globalCompositeOperation = "source-over"; g.globalAlpha = 1;
}
const hex = (s) => [1, 3, 5].map((i) => parseInt(s.slice(i, i + 2), 16));
const mix = (a, b, f) => a.map((v, i) => Math.round(v + (b[i] - v) * f));
function tintCache(m, k, img, col) {             // quantised colour steps, cached per effect
  const key = k + ":" + col.map((v) => v >> 4).join(",");
  m.tc = m.tc || {};
  if (!m.tc[key]) m.tc[key] = tinted(img, "#" + col.map((v) => v.toString(16).padStart(2, "0")).join(""));
  return m.tc[key];
}

// ---------------------------------------------------------------- shaders (WebGL2)
async function compileShader(m) {
  if (!gl) return null;
  const vs = await loadText(m.dir + m.shader.vertex);
  const fs = await loadText(m.dir + m.shader.fragment);
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(m.id + ": " + gl.getShaderInfoLog(s)); return s; };
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(m.id + ": " + gl.getProgramInfoLog(p));
  const textures = {};
  for (const [name, t] of Object.entries(m.shader.textures || {})) textures[name] = glTexture(await loadImage(m.dir + t.file), t.wrap === "repeat");
  return { p, textures };
}
function glTexture(img, repeat) {
  const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
  gl.generateMipmap(gl.TEXTURE_2D);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
  const wrap = repeat ? gl.REPEAT : gl.CLAMP_TO_EDGE;
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap);
  return tex;
}
let quad = null, floorTex = null, blobTex = null;
function drawShader(m, t, x0, y0, sqPx) {
  if (!m.program) return;
  const W = CELL, H = CELL;
  if (gl.canvas.width !== W) { gl.canvas.width = W; gl.canvas.height = H; }
  if (!quad) {
    quad = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, quad);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0, 0, 1, 0, 0, 1, 1, 1]), gl.STATIC_DRAW);
    floorTex = glTexture(floor, false);
    const b = document.createElement("canvas"); b.width = W; b.height = H; const x = b.getContext("2d");
    x.fillStyle = "#fff"; x.beginPath(); x.ellipse(W / 2, H / 2, W * 0.42, H * 0.32, 0.3, 0, 7); x.fill();
    blobTex = glTexture(b, false);
  }
  const { p, textures } = m.program;
  gl.viewport(0, 0, W, H); gl.useProgram(p);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  const loc = gl.getAttribLocation(p, "aPosition"); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const U = (n) => gl.getUniformLocation(p, n);
  gl.uniform4f(U("uInputSize"), W, H, 1 / W, 1 / H);
  gl.uniform4f(U("uOutputFrame"), 0, 0, W, H);
  gl.uniform4f(U("uOutputTexture"), W, H, -1, 0);
  gl.uniform4f(U("uInputClamp"), 0, 0, 1, 1);
  gl.uniform1f(U("uTime"), t); gl.uniform1f(U("uSquarePx"), sqPx); gl.uniform2f(U("uMapOrigin"), 0, 0);
  // the magic-circle shader's band defaults (a texture effect may name it in motion.shader)
  gl.uniform4f(U("uBands"), 0.35, 0.62, 0.8, 1); gl.uniform4f(U("uSpeeds"), -8, 5, -4, 3);
  gl.uniform1f(U("uPulse"), 0.3); gl.uniform1f(U("uPeriod"), 3);
  for (const [name, v] of Object.entries(m.shader.uniforms || {})) {
    const l = U(name); if (!l) continue;
    if (typeof v === "number") gl.uniform1f(l, v); else gl["uniform" + v.length + "fv"](l, v);
  }
  if (m.id === "night") {   // demo lights for the preview
    gl.uniform1f(U("uLightCount"), 2);
    gl.uniform4fv(U("uLights[0]"), [1.5, 1.6, 1.4, 1, 4.3, 4.0, 1.0, 0.9]);
  }
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, m.shader.apply === "mask" ? blobTex : floorTex); gl.uniform1i(U("uTexture"), 0);
  let unit = 1;
  for (const [name, tex] of Object.entries(textures)) { gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(gl.TEXTURE_2D, tex); gl.uniform1i(U(name), unit); unit++; }
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  g.drawImage(gl.canvas, x0, y0);
}

function drawEffect(m, t, dt, cx, cy, sqPx, x0, y0, scale = 1, phase = 0) {
  if (m.technique === "shader") return drawShader(m, t, x0, y0, sqPx);
  if (m.technique === "composite") { for (const part of m.parts) { const pm = byId[part.id]; if (pm) drawEffect(pm, t, dt, cx + part.x * sqPx * scale, cy + part.y * sqPx * scale, sqPx, x0, y0, scale * (part.scale || 1), part.phase || 0); } return; }
  if (m.technique === "layers") return drawLayers(m, t, cx, cy, sqPx, scale);
  if (m.technique === "texture") return drawTexture(m, t + phase, cx, cy, sqPx, scale);
  if (m.technique === "particles") return drawParticles(m, t, dt, cx, cy, sqPx, CELL, scale);
  return drawSheet(m, t, cx, cy, sqPx, scale, phase);
}

// ---------------------------------------------------------------- loop and controls
let last = performance.now();
function frame(now) {
  const t = now / 1000, dt = Math.min(0.1, (now - last) / 1000); last = now;
  const list = shown();
  g.fillStyle = "#101013"; g.fillRect(0, 0, stage.width, stage.height);
  list.forEach((m, i) => {
    const x0 = (i % cols) * CELL, y0 = Math.floor(i / cols) * (CELL + LABEL);
    g.save(); g.beginPath(); g.rect(x0, y0, CELL, CELL); g.clip();
    g.drawImage(floor, x0, y0);
    const sqPx = CELL / spanOf(m);
    drawEffect(m, t + m.seed, dt, x0 + CELL / 2, y0 + CELL / 2, sqPx, x0, y0);
    g.restore();
    g.fillStyle = m.licence.commercial ? "#cfd" : "#fbb";
    g.fillText(m.id, x0 + 4, y0 + CELL + 12);
    g.fillStyle = "#999";
    g.fillText(`${m.category} · ${m.technique} · ${m.licence.id}`, x0 + 4, y0 + CELL + 25);
  });
  requestAnimationFrame(frame);
}

function buildBar() {
  const bar = document.getElementById("bar");
  const cats = ["all", "global", "regional", "point", "aura", "map-loop"];
  for (const c of cats) {
    const b = document.createElement("button"); b.textContent = c; b.className = c === category ? "on" : "";
    b.onclick = () => { category = c; [...bar.querySelectorAll("button")].forEach((x) => x.className = x === b ? "on" : ""); layout(); };
    bar.append(b);
  }
  const info = document.createElement("span");
  info.textContent = `${effects.length} effects · ${Object.keys(compiledExtra).length + effects.filter((m) => m.program).length} shader programs compiled · green label = commercial use ok, red = non-commercial (JB2A)`;
  bar.append(info);
}

load().then(() => requestAnimationFrame(frame)).catch((e) => { document.body.append(String(e)); window.ready = true; window.failed = String(e); });
</script>
