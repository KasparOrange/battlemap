# The effects catalogue: every shipped effect, where it comes from and how it is built.
# build.py reads this file; v2/docs/effects.md explains the fields.
#
# squares   = width of the SOURCE frame in map squares (JB2A: px / 100, its grid; JB2A ranged
#             and cone files use a 200 px grid — see the per-effect notes)
# mode      = loop | once
# blend     = normal | add | screen | multiply
# layer     = ground (decals, circles: under the rest) | air (clouds, bursts: over the rest)
# category  = global | regional | point | aura | map-loop

# ------------------------------------------------------------------ sources
[sources.jb2a]
name = "JB2A — Jules&Ben's Animated Assets, free module"
author = "JB2A (Jules & Ben)"
licence = "CC BY-NC-SA 4.0"
licence_url = "https://creativecommons.org/licenses/by-nc-sa/4.0/"
commercial = false
share_alike = true
url = "https://github.com/Jules-Bens-Aa/JB2A_DnD5e"
attribution = "Animation © JB2A — Jules&Ben's Animated Assets (jb2a.com), CC BY-NC-SA 4.0. Resampled into a sprite sheet for battlemap."
dir = "jb2a-free"
input = "video"
blend = "normal"

[sources.unity]
name = "Unity Labs — free VFX image sequences & flipbooks"
author = "Unity Technologies (Unity Labs)"
licence = "CC0 1.0"
licence_url = "https://creativecommons.org/publicdomain/zero/1.0/"
url = "https://unity.com/blog/engine-platform/free-vfx-image-sequences-flipbooks"
attribution = "Flipbook by Unity Labs (CC0)."
