category = "map-loop"
technique = "shader"
source = "gemini"
shader = "water-flow.frag"
layer = "ground"
tags = ["water", "pool", "river", "fountain", "moat"]
apply = "mask"
textures = { uFlowTex = { source = "gemini", file = "water-tile.jpg", max_px = 512, wrap = "repeat" } }
uniforms = { uTileSquares = 4.0, uFlow = [0.15, 0.05], uStrength = 0.9, uCaustics = 0.5 }
notes = "Draw the water's shape (a filled polygon) and apply this filter: the shape's alpha is kept, its colour becomes moving water."

[[effect]]
id = "lava-pool"
name = "Lava (flowing)"
category = "map-loop"
technique = "shader"
source = "gemini"
shader = "lava-flow.frag"
layer = "ground"
damage = ["fire"]
tags = ["lava", "magma", "volcano", "hazard"]
apply = "mask"
textures = { uFlowTex = { source = "gemini", file = "lava-tile.jpg", max_px = 512, wrap = "repeat" } }
uniforms = { uTileSquares = 4.0, uFlow = [0.06, 0.02], uGlow = 0.6 }
notes = "Same use as water-pool; pairs with heat-haze over it."

