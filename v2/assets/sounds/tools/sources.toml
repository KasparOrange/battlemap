# The sound library's sources: one table per shipped sound. `build.py` reads this, cuts each
# raw file from `v2/assets-src/sounds/<file>` (gitignored downloads, one folder per source),
# loops beds seamlessly, normalises loudness and writes `../beds/`, `../oneshots/`, `../index.json`.
# Licence checked on each `url` page (2026-10-25/26). Only licences fine for the table, a paid
# product included: CC0 here; CC-BY would need `attribution`. Nothing non-commercial.
#
# Fields: id, kind (bed|oneshot), name, group, file, start/end (s; 0 = auto/whole), tags,
# effects (one-shots: effects-library ids it sounds with), duck (default true), extra (an
# ffmpeg filter appended before loudness), author, url, licence, licence_url, attribution.

