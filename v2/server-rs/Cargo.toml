[package]
name = "battlemap-server"
version = "0.1.0"
edition = "2024"
description = "battlemap v2's server in Rust: relay rooms, files + Store as, shared library, game backups, link fetch, log forward, the built app — one binary for the VPS and the TV box"
license = "MIT"
publish = false

[lib]
# rlib for the binary and the tests; cdylib = libbattlemap_server.so for the Android shell (JNI).
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.3"
hex = "0.4"
http-body-util = "0.1"
imagesize = "0.14"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
mime_guess = "2"
mwlog = { path = "../../../mwlog-rs" }
percent-encoding = "2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-webpki-roots", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "time", "sync", "io-util"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["fs", "catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std", "fmt"] }
url = "2"
webp = { version = "0.3", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

[dev-dependencies]
ts-rs = { version = "11", features = ["serde-json-impl"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "unwind"
